apiVersion: v1
kind: LimitRange
metadata:
  name: hardened-nginx
  namespace: hardened-nginx
  labels:
    app.kubernetes.io/name: hardened-nginx
    app.kubernetes.io/instance: hardened-nginx
    app.kubernetes.io/part-of: hardened-nginx
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 64Mi
      defaultRequest:
        cpu: 50m
        memory: 32Mi
      max:
        cpu: 500m
        memory: 256Mi
      min:
        cpu: 10m
        memory: 16Mi
